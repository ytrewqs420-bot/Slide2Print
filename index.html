<html lang="en" class="dark">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>

        :root {
            --paper: #f7f9f8;
            --ink: #17212b;
            --muted: #657382;
            --line: #dfe7ea;
            --cyan: #0ea5b7;
            --cyan-dark: #087b8b;
            --orange: #f97316;
            --green: #10b981;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background:
                linear-gradient(120deg, rgba(14, 165, 183, 0.08), transparent 34%),
                linear-gradient(180deg, #fbfcfb 0%, var(--paper) 48%, #eef3f1 100%);
            color: var(--ink);
            transition: background-color 0.3s, color 0.3s;
        }
        .brand-serif { font-family: 'Newsreader', serif; }
        .drag-active { border-color: #3b82f6; background-color: rgba(59, 130, 246, 0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .file-item { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .file-item.dragging { opacity: 0.5; transform: scale(0.98); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--cyan); margin-top: -6px; box-shadow: 0 4px 12px rgba(14, 165, 183, 0.32); cursor: pointer; border: 3px solid white; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #dce7e9; border-radius: 2px; }
        .dark input[type=range]::-webkit-slider-runnable-track { background: #334155; }
        .studio-panel { background: rgba(255,255,255,0.84); border: 1px solid rgba(203, 213, 225, 0.78); box-shadow: 0 24px 70px rgba(15, 23, 42, 0.08); backdrop-filter: blur(16px); }
        .control-surface { background: #f8fbfa; border: 1px solid #e2eaed; }
        .tool-shadow { box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08); }
        .dark .studio-panel { background: rgba(15,23,42,0.86); border-color: rgba(51,65,85,0.9); }
        .dark body { background: linear-gradient(120deg, rgba(14, 165, 183, 0.13), transparent 34%), #071018; }
        .studio-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        .pane-resizer { display: none; }
        @media (min-width: 1024px) {
            body { overflow: hidden; }
            .app-shell { height: 100vh; overflow: hidden; }
            .studio-grid {
                grid-template-columns:
                    minmax(280px, var(--left-pane, 330px))
                    6px
                    minmax(420px, 1fr)
                    6px
                    minmax(300px, var(--right-pane, 380px));
                column-gap: 0.7rem;
                align-items: start;
                height: calc(100vh - 8.75rem);
                overflow: hidden;
            }
            .workspace-pane {
                min-height: 0;
                max-height: calc(100vh - 8.75rem);
                overflow: hidden;
            }
            .queue-panel {
                display: flex;
                flex-direction: column;
                min-height: 0;
                height: clamp(260px, calc(100vh - 24rem), 420px);
                max-height: calc(100vh - 24rem);
            }
            .queue-scroll {
                min-height: 0;
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-width: thin;
            }
            .scrollable-pane {
                min-height: 0;
                max-height: calc(100vh - 8.75rem);
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-width: thin;
                padding-right: 2px;
            }
            .preview-scroll-pane {
                min-height: 0;
                max-height: calc(100vh - 8.75rem);
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-width: thin;
                padding-right: 2px;
            }
            .pane-resizer {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 6px;
                min-height: calc(100vh - 150px);
                cursor: col-resize;
                border-radius: 999px;
                touch-action: none;
            }
            .pane-resizer::before {
                content: "";
                width: 2px;
                height: 64px;
                border-radius: 999px;
                background: #cbd5e1;
                transition: background 0.15s, height 0.15s, box-shadow 0.15s;
            }
            .pane-resizer:hover::before,
            .pane-resizer.active::before {
                height: 112px;
                background: var(--cyan);
                box-shadow: 0 0 0 4px rgba(14, 165, 183, 0.12);
            }
        }
    </style>

                                                    </Tooltip>
                                                    {opt.s && <p className="ml-12 text-[10px] leading-4 text-gray-500">{opt.s}</p>}
                                                    {opt.k === 'page_numbers' && settings.page_numbers && <select value={settings.pagenum_pos} onChange={e => setSettings({...settings, pagenum_pos: e.target.value})} className="ml-11 text-[10px] bg-gray-50 dark:bg-slate-950 border rounded p-1"><option value="bottom_center">Bottom Center</option><option value="bottom_right">Bottom Right</option><option value="top_center">Top Center</option><option value="top_right">Top Right</option></select>}
                                                    {opt.k === 'separator' && settings.separator && <div className="ml-11 flex items-center gap-2"><span className="text-[10px] text-gray-400">Size:</span><input type="number" value={settings.separator_size} onChange={e => setSettings({...settings, separator_size: parseInt(e.target.value)})} className="w-12 text-[10px] bg-gray-50 dark:bg-slate-950 border rounded p-1" /></div>}
                                                    {opt.k === 'border' && settings.border && <div className="ml-11"><label className="text-[10px] text-gray-400 flex justify-between"><span>Opacity</span><span>{settings.border_opacity}%</span></label><input type="range" min="0" max="100" value={settings.border_opacity} onChange={e => setSettings({...settings, border_opacity: parseInt(e.target.value)})} className="w-full" /></div>}
                                                    {opt.k === 'manual_duplex_split' && settings.manual_duplex_split && <div className="ml-11 space-y-2">
                                                        <label className="text-[10px] text-gray-500 flex items-center gap-2"><input type="checkbox" checked={settings.manual_duplex_reverse_back} onChange={() => setSettings({...settings, manual_duplex_reverse_back: !settings.manual_duplex_reverse_back})} /><span>Reverse back pages (front-feed printers)</span></label>
                                                        <label className="text-[10px] text-gray-500 flex items-center gap-2"><input type="checkbox" checked={settings.manual_duplex_pad_even} onChange={() => setSettings({...settings, manual_duplex_pad_even: !settings.manual_duplex_pad_even})} /><span>Pad to even sheets (adds blank back if needed)</span></label>
                                                        <label className="text-[10px] text-gray-500 flex items-center gap-2"><input type="checkbox" checked={settings.manual_duplex_instructions} onChange={() => setSettings({...settings, manual_duplex_instructions: !settings.manual_duplex_instructions})} /><span>Include print instructions file</span></label>
                                                        <p className="text-[10px] text-cyan-500/80">Tip: If back pages come out upside-down or mismatched, keep this mode enabled and toggle only the reverse option.</p>
                                                    </div>}
                                                </div>
                                            ))}
                                        </div>
                                    </CollapsibleSection>

                                    <div className="flex items-center justify-between pt-4 border-t border-gray-100 dark:border-slate-800">
                                        <label className="text-[10px] font-bold text-gray-400 uppercase">Output Format</label>
                                        <div className="flex bg-gray-100 dark:bg-slate-800 p-1.5 rounded-xl">
                                            {['single', 'per_file'].map(m => (
                                                <button key={m} onClick={() => setSettings({...settings, output_split: m})} className={`px-5 py-2 text-xs font-bold rounded-lg transition-all ${settings.output_split === m ? 'bg-white dark:bg-slate-700 shadow-md text-cyan-600' : 'text-gray-400'}`}>{m === 'single' ? 'Single PDF' : 'ZIP (Per File)'}</button>
                                            ))}
                                        </div>
                                    </div>
                                    
                                    <button 
                                        disabled={files.length === 0 || files.some(f => f.status === 'loading')}
                                        onClick={async () => {
                                            if (files.length === 0) return;
                                            setStatus("Starting..."); setProgress(0); setIsProcessing(true);
                                            try {
                                                const exportNames = getExportNames();
                                                if (settings.output_split === 'per_file') {
                                                    const zip = new JSZip();
                                                    const fileConcurrency = getProcessingConcurrency(settings, 'file');
                                                    const fileProgress = Array(files.length).fill(0);
                                                    const updateFileProgress = (fileIndex, evt) => {
                                                        if (typeof evt.percent === 'number') fileProgress[fileIndex] = evt.percent;
                                                        const aggregate = fileProgress.reduce((sum, value) => sum + value, 0) / Math.max(1, files.length);
                                                        setProgress(Math.round(aggregate * 0.9));
                                                        if (evt.message) setStatus(`${fileIndex + 1}/${files.length}: ${evt.message}`);
                                                    };
                                                    setStatus(`Processing ${files.length} files with ${fileConcurrency} lane${fileConcurrency > 1 ? 's' : ''}...`);
                                                    const perFileSettings = fileConcurrency > 1 ? { ...settings, performance_mode: settings.performance_mode === 'fast' ? 'balanced' : 'safe' } : settings;
                                                    const zipEntries = await runLimited(files, fileConcurrency, async (f, i) => {
                                                        const bytes = await processPDF([f], perFileSettings, (evt) => updateFileProgress(i, evt));
                                                        const baseName = exportNames.entryBase(f, i);
                                                        if (settings.manual_duplex_split) {
                                                            setStatus(`Splitting ${f.name} for duplex...`);
                                                            fileProgress[i] = Math.max(fileProgress[i], 92);
                                                            const split = await splitForManualDuplex(bytes, { reverseBackPages: settings.manual_duplex_reverse_back, padToEven: settings.manual_duplex_pad_even });
                                                            const entries = [
                                                                { name: `${baseName}-front.pdf`, bytes: split.front },
                                                                { name: `${baseName}-back.pdf`, bytes: split.back }
                                                            ];
                                                            fileProgress[i] = 100;
                                                            updateFileProgress(i, { message: `Finished ${f.name}`, percent: 100 });
                                                            return { baseName, split, entries };
                                                        } else {
                                                            fileProgress[i] = 100;
                                                            updateFileProgress(i, { message: `Finished ${f.name}`, percent: 100 });
                                                            return { baseName, entries: [{ name: `${baseName}.pdf`, bytes }] };
                                                        }
                                                    });
                                                    zipEntries.forEach((result) => {
                                                        result.entries.forEach(entry => zip.file(entry.name, entry.bytes));
                                                        if (settings.manual_duplex_split && settings.manual_duplex_instructions) {
                                                            addManualDuplexInstructions(zip, result.baseName, result.split, settings.manual_duplex_reverse_back);
                                                        }
                                                    });
                                                    setStatus("Building ZIP...");
                                                    setProgress(95);
                                                    const content = await zip.generateAsync({type:"blob"});
                                                    download(content, exportNames.perFileZip);
                                                } else {
                                                    const bytes = await processPDF(files, settings, (evt) => updateProcessingProgress(evt, 0, settings.manual_duplex_split ? 88 : 96)); 
                                                    if (settings.manual_duplex_split) {
                                                        setStatus("Splitting output for manual duplex...");
                                                        setProgress(90);
                                                        const split = await splitForManualDuplex(bytes, { reverseBackPages: settings.manual_duplex_reverse_back, padToEven: settings.manual_duplex_pad_even });
                                                        const zip = new JSZip();
                                                        zip.file(exportNames.frontName, split.front);
                                                        zip.file(exportNames.backName, split.back);
                                                        if (settings.manual_duplex_instructions) addManualDuplexInstructions(zip, exportNames.batchBase, split, settings.manual_duplex_reverse_back);
                                                        setStatus("Building ZIP...");
                                                        setProgress(96);
                                                        const content = await zip.generateAsync({type:"blob"});
                                                        download(content, exportNames.singleZip);
                                                    } else {
                                                        download(bytes, exportNames.singlePdf, "application/pdf");
                                                    }
                                                }
                                                setProgress(100);
                                                setShowSuccess(true);
                                                setTimeout(() => setShowSuccess(false), 5000);
                                            } catch (e) { 
                                                alert(e.message); 
                                            } finally { 
                                                setIsProcessing(false);
                                                setProgress(0);
                                            }
                                        }} 
                                        className={`w-full py-5 font-black text-xl rounded-xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 ${files.length === 0 || files.some(f => f.status === 'loading') ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-slate-950 hover:bg-cyan-700 dark:bg-cyan-500 dark:hover:bg-cyan-400 dark:text-slate-950 text-white'}`}
                                    >
                                        {files.length === 0 ? 'Upload files to start' : files.some(f => f.status === 'loading') ? <><IconLoader /> Loading files...</> : <><IconUpload /> {(settings.output_split === 'single' && !settings.manual_duplex_split) ? 'Export PDF' : 'Export ZIP'}</>}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
